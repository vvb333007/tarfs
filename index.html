<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TarFS Documentation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: calc(100% - 40px);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .links a {
            display: inline-block;
            padding: 12px 24px;
            background: #0366d6;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
        }

        .links a:hover {
            background: #024ea2;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>TarFS Documentation</h1>

    <p>Please select the documentation language.</p>

    <div class="links">
        <a href="docs/html/">English</a>
        <a href="docs/html_ru/">Русский</a>
    </div>
</div>

</body>
</html>
